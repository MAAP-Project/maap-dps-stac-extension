name: Publish JSON Schema
on:
  release:
    types: [published]
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: deploy JSON Schema for version ${{ github.event.release.tag_name }}
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: json-schema
          destination_dir: ${{ github.event.release.tag_name }}
