[project]
name = "pystac-ext-maap-dps"
version = "0.1.0"
description = "PySTAC extension for MAAP DPS metadata and provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Henry Rodman", email = "henry@developmentseed.org" }]
dependencies = [
    "pystac-core>=1.15.2,<2",
]

[project.entry-points."pystac.extensions"]
maap-dps = "pystac.extensions.maap_dps:MAAP_DPS_EXTENSION_HOOKS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pystac"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
